name: Gardener GDC Release Pipeline

on:
  # Run every weeknight (Monday through Friday at 02:00 PST / 10:00 UTC; no weekend runs)
  schedule:
    - cron: '0 10 * * 1-5'
  # Allow authorized maintainers to trigger on Pull Requests via '/test-release' comment
  issue_comment:
    types: [created]
  # Allow manual trigger by approved Google and SAP maintainers only
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Pipeline execution mode (snapshot for pre-release/nightly, release for official SemVer release)'
        required: false
        default: 'snapshot'
        type: choice
        options:
          - snapshot
          - release
      next_version:
        description: 'Next -dev version bump operation after a successful official release (used when release_mode == release)'
        required: false
        default: 'bump-patch'
        type: choice
        options:
          - bump-patch
          - bump-minor
          - bump-major
          - noop
      pr_number:
        description: 'Optional Pull Request number to test (merges main into PR branch and reports check-run on PR)'
        required: false
        default: ''
        type: string
      extension_gdc_ref:
        description: 'Git ref (branch/tag/SHA) for gardener/gardener-extension-provider-gdc'
        required: false
        default: 'main'
        type: string
      mcm_provider_gdc_ref:
        description: 'Git ref (branch/tag/SHA) for gardener/machine-controller-manager-provider-gdc'
        required: false
        default: 'main'
        type: string
      external_dns_ref:
        description: 'Git ref (branch/tag/SHA) for gardener/external-dns-management'
        required: false
        default: 'master'
        type: string
      cloud_provider_gdc_ref:
        description: 'Git ref (branch/tag/SHA) for GoogleCloudPlatform/cloud-provider-gdc'
        required: false
        default: 'main'
        type: string
      skip_conformance:
        description: 'Skip Sonobuoy CNCF conformance suite (faster validation run)'
        required: false
        default: false
        type: boolean
      publish_to_public_registry:
        description: 'Publish certified artifacts to Gardener public registry on success'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  checks: write
  issues: write
  pull-requests: read

concurrency:
  group: gardener-gdc-release-pipeline-${{ inputs.pr_number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'issue_comment' || inputs.pr_number != '' }}

jobs:
  authorize:
    name: Authorize Trigger (Google & SAP Maintainers)
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/test-release'))
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.auth.outputs.should_run }}
      pr_number: ${{ steps.auth.outputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify maintainer authorization on manual dispatch or PR comment
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          source ./scripts/ci-common.sh
          verify_authorized_maintainer OWNERS_ALIASES

  release-pipeline:
    name: E2E Release Certification & Promotion
    needs: authorize
    if: needs.authorize.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: gdc-staging
    concurrency:
      group: gardener-gdc-staging-env
      cancel-in-progress: false
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GDC_RELEASE_GITHUB_TOKEN: ${{ secrets.GDC_RELEASE_GITHUB_TOKEN }}
      PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
      RELEASE_MODE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release') || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/test-release release'))) && 'release' || 'snapshot' }}
      NEXT_VERSION: ${{ inputs.next_version || 'bump-patch' }}
      EXTENSION_GDC_REF: ${{ inputs.extension_gdc_ref || 'main' }}
      MCM_PROVIDER_GDC_REF: ${{ inputs.mcm_provider_gdc_ref || 'main' }}
      EXTERNAL_DNS_REF: ${{ inputs.external_dns_ref || 'master' }}
      CLOUD_PROVIDER_GDC_REF: ${{ inputs.cloud_provider_gdc_ref || 'main' }}
      SKIP_CONFORMANCE: ${{ inputs.skip_conformance || 'false' }}
      GDC_RELEASE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDC_RELEASE_SERVICE_ACCOUNT_KEY }}
      GDC_RELEASE_HARBOR_DOCKER_CONFIG_JSON: ${{ secrets.GDC_RELEASE_HARBOR_DOCKER_CONFIG_JSON }}
    steps:
      - name: Checkout gardener-gdc-ci
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Record Pipeline Start Time
        run: echo "PIPELINE_START_EPOCH=$(date -u +%s)" >> "${GITHUB_ENV}"

      - name: Checkout target Pull Request if requested
        if: env.PR_NUMBER != ''
        run: |
          source ./scripts/ci-common.sh
          checkout_pr_if_requested

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud (GKE Virtual Garden Runtime Clusters & GCS)
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_VIRTUAL_GARDEN_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud SDK & GKE Auth Plugin
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Stage 1 - Build & Push Candidate Artifacts to GHCR
        id: stage_build
        run: ./scripts/release/1-build_and_push_artifacts.sh

      - name: Stage 2 - Prepare Pipeline Configuration & Bootstrap GDC CLI
        id: stage_prepare
        run: ./scripts/release/2-prepare_pipeline_configuration.sh

      - name: Stage 3 - Deploy Gardener (Virtual Garden)
        id: stage_deploy_garden
        run: ./scripts/release/3-deploy_gardener.sh

      - name: Stage 4 - Deploy GDC Seed (Gardenlet)
        id: stage_deploy_seed
        run: ./scripts/release/4-deploy_seed.sh

      - name: Stage 5 - Provision GDC Shoot Cluster
        id: stage_deploy_shoot
        run: ./scripts/release/5-deploy_shoot.sh

      - name: Stage 6 - Run Shoot Functional & Conformance Suites
        id: stage_test_shoot
        run: ./scripts/release/6-test_shoot.sh

      - name: Stage 7 - Teardown Gardener Stack (Always)
        id: stage_teardown
        if: always()
        run: ./scripts/release/7-teardown_gardener.sh

      - name: Determine Gardener OCI Registry Parameters
        id: gardener_params
        if: success() && (github.event_name == 'schedule' || github.event_name == 'issue_comment' || inputs.publish_to_public_registry == true)
        uses: gardener/cc-utils/.github/actions/params@v1
        with:
          mode: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release') || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/test-release release'))) && 'release' || 'snapshot' }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Gardener Public Registry (OIDC via gardener/cc-utils)
        if: success() && steps.gardener_params.outputs.can-push == 'true' && (github.event_name == 'schedule' || github.event_name == 'issue_comment' || inputs.publish_to_public_registry == true)
        uses: gardener/cc-utils/.github/actions/oci-auth@v1
        with:
          oci-image-reference: ${{ steps.gardener_params.outputs.oci-registry }},ghcr.io/gardener
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage 8 - Promote Certified Artifacts to Gardener Public Registry
        id: stage_publish
        if: success() && steps.gardener_params.outputs.can-push == 'true' && (github.event_name == 'schedule' || github.event_name == 'issue_comment' || inputs.publish_to_public_registry == true)
        env:
          PUBLIC_REGISTRY: ${{ steps.gardener_params.outputs.oci-registry }}/gardener/gardener-gdc-ci
        run: ./scripts/release/8-publish_release_artifacts.sh

      - name: Stage 9 - Prepare OCM Component Descriptor Fragments
        id: ocm_inputs
        if: success() && steps.stage_publish.outcome == 'success' && steps.gardener_params.outputs.can-push == 'true' && (github.event_name == 'schedule' || github.event_name == 'issue_comment' || inputs.publish_to_public_registry == true)
        env:
          RELEASE_METADATA_FILE: /tmp/gardener-gdc-release/release-metadata.yaml
          CERTIFIED_RELEASE_MANIFEST: /tmp/gardener-gdc-release/artifacts/certified-release-manifest.json
          OCM_RESOURCES_FILE: /tmp/gardener-gdc-release/ocm-resources.json
          OCM_SOURCES_FILE: /tmp/gardener-gdc-release/ocm-sources.json
          RELEASE_NOTES_FILE: /tmp/gardener-gdc-release/gdc-release-notes.md
          GOSEC_REPORT_FILE: /tmp/gardener-gdc-release/artifacts/gosec-report.sarif
        run: |
          # No-change official runs reuse the existing component version and descriptor.
          if [[ "${RELEASE_MODE}" == "release" && "$(yq '.components.gardenerExtensionProviderGDC.needsRelease' "${RELEASE_METADATA_FILE}")" == "false" ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"
          python3 ./scripts/release/helpers/generate_component_descriptor_fragments.py \
            --manifest "${CERTIFIED_RELEASE_MANIFEST}" \
            --resources "${OCM_RESOURCES_FILE}" \
            --sources "${OCM_SOURCES_FILE}"
          echo "source_repository=$(jq -r '.sources[] | select(.name == \"gardener-extension-provider-gdc\") | .repository' "${CERTIFIED_RELEASE_MANIFEST}" | sed -e 's#^https://##' -e 's#\.git$##')" >> "${GITHUB_OUTPUT}"
          echo "source_version=$(jq -r '.sources[] | select(.name == \"gardener-extension-provider-gdc\") | .version' "${CERTIFIED_RELEASE_MANIFEST}")" >> "${GITHUB_OUTPUT}"
          echo "version=$(jq -r '.releaseVersion' "${CERTIFIED_RELEASE_MANIFEST}")" >> "${GITHUB_OUTPUT}"
          # The aggregated GDC release notes are only produced when the extension provider
          # is actually released (release mode + code changes). When present, embed them in
          # the component descriptor and attach the descriptor to that GitHub Release.
          if [[ -f "${RELEASE_NOTES_FILE}" ]]; then
            echo "attach=true" >> "${GITHUB_OUTPUT}"
          else
            echo "attach=false" >> "${GITHUB_OUTPUT}"
          fi
          # The gosec SAST report is produced in release mode when the extension is built
          # from source. When present, attach it as the component descriptor's SAST resource.
          if [[ -s "${GOSEC_REPORT_FILE}" ]]; then
            echo "sast=true" >> "${GITHUB_OUTPUT}"
          else
            echo "sast=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create OCM Base Component Descriptor
        id: ocm_base
        if: steps.ocm_inputs.outcome == 'success' && steps.ocm_inputs.outputs.publish == 'true'
        uses: gardener/cc-utils/.github/actions/base-component-descriptor@v1
        with:
          version: ${{ steps.ocm_inputs.outputs.version }}
          ocm-repository: ${{ steps.gardener_params.outputs.ocm-repository }}

      - name: Export Certified Artifacts as OCM Fragments
        id: ocm_resources
        if: steps.ocm_inputs.outcome == 'success' && steps.ocm_inputs.outputs.publish == 'true'
        uses: gardener/cc-utils/.github/actions/export-ocm-fragments@v1
        with:
          ocm-resources-file: /tmp/gardener-gdc-release/ocm-resources.json
          ctx: gdc-certified

      - name: Attach Release Notes as OCM Fragment
        id: ocm_notes_blob
        if: steps.ocm_inputs.outcome == 'success' && steps.ocm_inputs.outputs.attach == 'true'
        run: |
          mkdir -p /tmp/gardener-gdc-release/blobs.d
          tar czf /tmp/gardener-gdc-release/blobs.d/release-notes.tar.gz \
            -C /tmp/gardener-gdc-release gdc-release-notes.md

      - name: Export Release Notes OCM Fragment
        id: ocm_notes
        if: steps.ocm_inputs.outcome == 'success' && steps.ocm_inputs.outputs.attach == 'true'
        uses: gardener/cc-utils/.github/actions/export-ocm-fragments@v1
        with:
          ctx: gdc-certified
          blobs-directory: /tmp/gardener-gdc-release/blobs.d
          ocm-resources: |
            - name: release-notes
              relation: local
              access:
                type: localBlob
                localReference: release-notes.tar.gz
              labels:
                - name: gardener.cloud/purposes
                  value:
                    - release-notes

      - name: Attach gosec SAST Report as OCM Fragment
        id: ocm_sast_blob
        if: steps.ocm_inputs.outcome == 'success' && steps.ocm_inputs.outputs.sast == 'true'
        run: |
          mkdir -p /tmp/gardener-gdc-release/blobs.d
          tar czf /tmp/gardener-gdc-release/blobs.d/gosec-report.tar.gz \
            -C /tmp/gardener-gdc-release/artifacts gosec-report.sarif

      - name: Export gosec SAST Report OCM Fragment
        id: ocm_sast
        if: steps.ocm_inputs.outcome == 'success' && steps.ocm_inputs.outputs.sast == 'true'
        uses: gardener/cc-utils/.github/actions/export-ocm-fragments@v1
        with:
          ctx: gdc-certified
          blobs-directory: /tmp/gardener-gdc-release/blobs.d
          ocm-resources: |
            - name: gosec-report
              relation: local
              access:
                type: localBlob
                localReference: gosec-report.tar.gz
              labels:
                - name: gardener.cloud/purposes
                  value:
                    - lint
                    - sast
                    - gosec
                - name: gardener.cloud/comment
                  value: |
                    we use gosec (linter) for SAST scans
                    see: https://github.com/securego/gosec

      - name: Merge OCM Component Descriptor
        id: ocm_merge
        if: steps.ocm_inputs.outcome == 'success' && steps.ocm_inputs.outputs.publish == 'true'
        uses: gardener/cc-utils/.github/actions/merge-ocm-fragments@v1
        with:
          component-descriptor-artefact: base-component-descriptor
          ctx: gdc-certified
          outdir: /tmp/gardener-gdc-release/ocm
          post-process: none
          upload-artifact-name: ''

      - name: Finalize OCM Certified Sources
        id: ocm_finalize
        if: steps.ocm_merge.outcome == 'success'
        env:
          OCM_SOURCES_FILE: /tmp/gardener-gdc-release/ocm-sources.json
        run: |
          bash ./scripts/release/helpers/finalize_component_descriptor.sh \
            /tmp/gardener-gdc-release/ocm/component-descriptor.yaml \
            /tmp/gardener-gdc-release/ocm/component-descriptor.tar.gz

      - name: Upload OCM Component Descriptor Artifact
        id: ocm_artifact
        if: steps.ocm_finalize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gdc-component-descriptor
          path: /tmp/gardener-gdc-release/ocm/component-descriptor.tar.gz
          if-no-files-found: error

      - name: Authenticate to OCM Repository
        id: ocm_auth
        if: steps.ocm_finalize.outcome == 'success'
        uses: gardener/cc-utils/.github/actions/oci-auth@v1
        with:
          oci-image-reference: ${{ steps.gardener_params.outputs.ocm-repository }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate OCM Component Descriptor
        id: ocm_validate
        if: steps.ocm_finalize.outcome == 'success'
        uses: gardener/cc-utils/.github/actions/ocm-validate@v1
        with:
          component-descriptor-path: /tmp/gardener-gdc-release/ocm/component-descriptor.yaml
          validation-cfg: |
            schema: fail
            access: fail
            artefact-uniqueness: fail
          recursion-depth: 0

      - name: Publish OCM Component Descriptor
        id: ocm_publish
        if: steps.ocm_finalize.outcome == 'success'
        run: |
          python -m ocm upload \
            --file /tmp/gardener-gdc-release/ocm/component-descriptor.yaml \
            --blobs-dir /tmp/gardener-gdc-release/ocm/blobs.d \
            --on-exist overwrite

      - name: Attach Component Descriptor to Extension GitHub Release
        id: ocm_release_asset
        if: steps.ocm_finalize.outcome == 'success' && steps.ocm_inputs.outputs.attach == 'true'
        env:
          # The extension provider lives in a separate repository, so GITHUB_TOKEN
          # (scoped to gardener-gdc-ci) cannot edit its release; use the release PAT.
          GH_TOKEN: ${{ env.GDC_RELEASE_GITHUB_TOKEN }}
          EXT_REPO_SLUG: ${{ steps.ocm_inputs.outputs.source_repository }}
          EXT_RELEASE_VERSION: ${{ steps.ocm_inputs.outputs.source_version }}
        run: |
          gh release upload "${EXT_RELEASE_VERSION}" \
            /tmp/gardener-gdc-release/ocm/component-descriptor.yaml \
            --repo "${EXT_REPO_SLUG}" --clobber

      - name: Stage 10 - Update Release Pipeline Dashboard & Summary
        if: always()
        env:
          PUBLIC_REGISTRY: ${{ steps.gardener_params.outputs.oci-registry && format('{0}/gardener/gardener-gdc-ci', steps.gardener_params.outputs.oci-registry) || 'europe-docker.pkg.dev/gardener-project/snapshots/gardener/gardener-gdc-ci' }}
          STAGE_BUILD_STATUS: ${{ steps.stage_build.outcome }}
          STAGE_DEPLOY_GARDEN_STATUS: ${{ steps.stage_deploy_garden.outcome }}
          STAGE_DEPLOY_SEED_STATUS: ${{ steps.stage_deploy_seed.outcome }}
          STAGE_DEPLOY_SHOOT_STATUS: ${{ steps.stage_deploy_shoot.outcome }}
          STAGE_TEST_SHOOT_STATUS: ${{ steps.stage_test_shoot.outcome }}
          STAGE_TEARDOWN_STATUS: ${{ steps.stage_teardown.outcome }}
          STAGE_PUBLISH_STATUS: ${{ steps.stage_publish.outcome }}
          OCM_STEPS_JSON: ${{ toJSON(steps) }}
          OCM_DESCRIPTOR_ARTIFACT_URL: ${{ steps.ocm_artifact.outputs.artifact-url }}
          OVERALL_PIPELINE_STATUS: ${{ job.status }}
        run: |
          export STAGE_OCM_STATUS="$(python3 -c '
          import json, os
          steps = json.loads(os.environ["OCM_STEPS_JSON"])
          outcomes = [step["outcome"] for name, step in steps.items() if name.startswith("ocm_")]
          print("failure" if "failure" in outcomes else
                "cancelled" if "cancelled" in outcomes else
                steps.get("ocm_publish", {}).get("outcome", "skipped"))
          ')"
          ./scripts/release/9-update_dashboard.sh

      - name: Deploy Release Pipeline Dashboard to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && needs.authorize.outputs.pr_number == ''
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dashboard

  publish-dashboard:
    name: Publish Dashboard (GitHub Pages)
    needs: [authorize, release-pipeline]
    if: always() && github.ref == 'refs/heads/main' && needs.authorize.outputs.pr_number == '' && (needs.release-pipeline.result == 'success' || needs.release-pipeline.result == 'failure')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
